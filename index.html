<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walrus Blurbs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #ffffff;
    color: #1a1a1a;
    font-family: "Lexend", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8vh 1.5rem 4rem;
  }
  main {
    width: 100%;
    max-width: 640px;
  }
  #search-box {
    width: 100%;
    font-family: "Lexend", sans-serif;
    font-size: 1.05rem;
    padding: 0.9rem 1.1rem;
    border: 1px solid #e2e2e2;
    border-radius: 10px;
    outline: none;
    color: #1a1a1a;
  }
  #search-box:focus {
    border-color: #1a1a1a;
  }
  #results {
    margin-top: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  #results a {
    display: block;
    padding: 0.9rem 1.1rem;
    border: 1px solid #e2e2e2;
    border-radius: 10px;
    color: #1a1a1a;
    text-decoration: none;
    font-weight: 500;
    transition: border-color 0.15s ease;
  }
  #results a:hover {
    border-color: #1a1a1a;
  }
  #results a span {
    display: block;
    font-weight: 300;
    font-size: 0.85rem;
    color: #777;
    margin-top: 0.2rem;
  }
</style>
</head>
<body>
<main>
  <input id="search-box" type="text" placeholder="Search" autofocus>
  <div id="results"></div>
</main>

<script src="./pagefind/pagefind.js" type="module"></script>
<script type="module">
  const pagefind = await import("./pagefind/pagefind.js");
  await pagefind.init();

  const input = document.getElementById("search-box");
  const results = document.getElementById("results");

  async function runSearch(term) {
    results.innerHTML = "";
    const search = await pagefind.search(term || null);
    const data = await Promise.all(search.results.map(r => r.data()));
    if (data.length === 0) {
      results.innerHTML = '<p style="color:#777;">No walruses found.</p>';
      return;
    }
    data.forEach(page => {
      const a = document.createElement("a");
      a.href = page.url;
      a.innerHTML = `${page.meta.title || page.url}<span>${page.excerpt}</span>`;
      results.appendChild(a);
    });
  }

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      // Empty box + Enter shows every walrus (pagefind treats a null term as "match all").
      runSearch(input.value.trim() || null);
    }
  });
</script>
</body>
</html>
